# Lint, test, coverage gate, Semgrep, and Codecov upload for mcp-wizard-generators.
# Requires repo/org secret CODECOV_TOKEN (or Codecov GitHub App) for uploads
# on private repos and for reliable main-branch uploads after going public.
# PR CI does not require PyPI / Trusted Publisher secrets.
#
# Quality steps live in quality.yml (workflow_call) and are shared with publish-pypi.

name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
