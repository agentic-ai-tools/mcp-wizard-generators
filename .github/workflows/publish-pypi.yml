# OIDC Trusted Publisher stub for PyPI org agentic-ai-tools /
# project mcp-wizard-generators.
#
# Does NOT run on PRs (PR CI stays free of publish credentials).
# No long-lived PyPI API tokens — uses GitHub OIDC → PyPI Trusted Publisher.
#
# Human setup (after org approval):
#   1. On TestPyPI and PyPI, create a Trusted Publisher for project
#      `mcp-wizard-generators` pointing at this repo + this workflow.
#   2. Create GitHub Environments `testpypi` and `pypi` (optional reviewers).
#   3. Set repository variable ENABLE_PYPI_PUBLISH=true when ready to publish
#      on version tags (workflow_dispatch always builds; publish steps gated).
#
# Tag pushes still attach dist assets via publish-github-release.yml.

name: Publish to TestPyPI / PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
          - both

permissions:
  contents: read

jobs:
  build:
    name: Build dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI (OIDC)
    needs: build
    if: >
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.target == 'testpypi' || github.event.inputs.target == 'both'))
      || (github.event_name == 'push' && vars.ENABLE_PYPI_PUBLISH == 'true')
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: Publish to PyPI (OIDC)
    needs: [build, publish-testpypi]
    # Allow pypi-only dispatch; on tags require testpypi job when publish enabled.
    if: >
      always() && needs.build.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.target == 'pypi' || github.event.inputs.target == 'both') &&
          (github.event.inputs.target == 'pypi' || needs.publish-testpypi.result == 'success'))
        || (github.event_name == 'push' && vars.ENABLE_PYPI_PUBLISH == 'true' &&
            needs.publish-testpypi.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
