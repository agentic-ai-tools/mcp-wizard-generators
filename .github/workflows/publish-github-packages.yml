# Publish mcp-wizard-generators to GitHub Packages (PyPI endpoint) on version tags.
# Stub is draft-ready: enable after org Packages permissions are confirmed.
#
# Trigger: push tag vX.Y.Z (must match pyproject version) or manual workflow_dispatch.
# Registry: https://upload.pypi.pkg.github.com/agentic-ai-tools/
# Install:  pip install mcp-wizard-generators --index-url https://pypi.pkg.github.com/agentic-ai-tools/simple/

name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only; skip twine upload"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check dist artifacts
        run: |
          python -m twine check dist/*
          ls -la dist/

      - name: Publish to GitHub Packages
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python -m twine upload
          --repository-url https://upload.pypi.pkg.github.com/agentic-ai-tools/
          dist/*
