# Reusable quality gate: lint + test (3.11/3.12) + Semgrep.
# Called by ci.yml and publish-pypi.yml (must pass before any index publish).

name: Quality

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
      SEMGREP_APP_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

  test:
    name: Test (coverage)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pytest with coverage
        run: >
          python -m pytest -m "not e2e"
          --cov=mcp_wizard_generators
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=lcov:coverage.lcov

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml,coverage.lcov
          flags: unittests
          name: mcp-wizard-generators
          # Token may be unset until Codecov App / CODECOV_TOKEN is wired;
          # local coverage --cov-fail-under still gates the job above.
          fail_ci_if_error: false

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep scan (App token or OSS fallback)
        run: |
          set -eu
          # Exclude generated goldens (fixtures, not product source).
          EXCLUDES="--exclude=tests/goldens"
          if [ -n "${SEMGREP_APP_TOKEN:-}" ]; then
            echo "Using Semgrep AppSec Platform (SEMGREP_APP_TOKEN / App install)."
            semgrep ci $EXCLUDES
          else
            echo "SEMGREP_APP_TOKEN unset — OSS rules with --error (library fail-closed)."
            echo "Install the Semgrep GitHub App on the org and/or set SEMGREP_APP_TOKEN."
            semgrep scan \
              --config p/python \
              --config p/security-audit \
              --config p/secrets \
              --error \
              $EXCLUDES
          fi
