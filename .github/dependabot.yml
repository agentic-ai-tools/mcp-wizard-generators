# Keep Actions and Python tooling current for a public library repo.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Hash lock shipped in every generated python-mcp project (ADR-023).
  # CI re-checks it with scripts/lock_python_mcp.py --check.
  - package-ecosystem: "pip"
    directory: "/src/mcp_wizard_generators/plugins/python_mcp/lock"
    schedule:
      interval: "weekly"
    groups:
      generated-server-deps:
        patterns: ["*"]
    open-pull-requests-limit: 5
