[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-wizard-generators"
version = "0.3.0"
description = "Pluggable OpenAPI → MCP generators for MCP Wizard (local Python MCP + AgentCore)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "agentic-ai-tools" }]
keywords = ["mcp", "openapi", "generators", "agentcore", "cursor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/agentic-ai-tools/mcp-wizard-generators"
Repository = "https://github.com/agentic-ai-tools/mcp-wizard-generators"
Issues = "https://github.com/agentic-ai-tools/mcp-wizard-generators/issues"
Documentation = "https://github.com/agentic-ai-tools/mcp-wizard-generators#readme"
# PyPI org: agentic-ai-tools — project name mcp-wizard-generators (Trusted Publisher stub).
Changelog = "https://github.com/agentic-ai-tools/mcp-wizard-generators/releases"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "tox>=4.0",
  "ruff>=0.6",
  # Runtime smoke for generated local MCP packages (mcp 2.x MCPServer API).
  "mcp>=2.0.0,<3",
  "httpx>=0.27",
  # Wheel/sdist build + twine check (make dist / release workflow).
  "build>=1.2",
  "twine>=5.0",
]

[project.scripts]
mcp-wizard-gen = "mcp_wizard_generators.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_wizard_generators"]

[tool.hatch.build.targets.sdist]
include = [
  "src/mcp_wizard_generators",
  "tests",
  "README.md",
  "LICENSE",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "pyproject.toml",
  "scripts",
  "Makefile",
  "tox.ini",
  "docs",
  "codecov.yml",
  ".github/workflows",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "e2e: install, start, and invoke a generated MCP server (needs network)",
]

[tool.coverage.run]
branch = true
source = ["mcp_wizard_generators"]
omit = ["*/tests/*", "*/goldens/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/goldens"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
