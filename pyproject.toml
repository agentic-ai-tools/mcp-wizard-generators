[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-wizard-generators"
version = "0.2.0"
description = "Pluggable OpenAPI → MCP generators for MCP Wizard (local Python MCP + AgentCore)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "agentic-ai-tools" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "tox>=4.0",
  "ruff>=0.6",
  # Runtime smoke for generated local MCP packages (mcp 2.x MCPServer API).
  "mcp>=2.0.0,<3",
  "httpx>=0.27",
]

[project.scripts]
mcp-wizard-gen = "mcp_wizard_generators.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_wizard_generators"]

[tool.hatch.build.targets.sdist]
include = ["src/mcp_wizard_generators", "tests", "README.md", "pyproject.toml", "scripts", "Makefile", "tox.ini", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/goldens"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
