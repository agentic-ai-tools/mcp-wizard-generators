[tox]
env_list = py311, py312, lint
minversion = 4.0
skip_missing_interpreters = true

[testenv]
description = Run pytest against the src layout
package = editable
extras = dev
commands = pytest -m "not e2e" {posargs:tests}

[testenv:lint]
description = Ruff format check + lint
extras = dev
commands =
  ruff format --check .
  ruff check .
