# Generated by mcp-wizard-generators. Deploys to AWS Bedrock AgentCore on every
# push to main (DEPLOY.md, step "GitHub Actions"). Repository variables:
# AWS_DEPLOY_ROLE_ARN, AWS_REGION, TF_STATE_BUCKET and CODE_BUCKET (bootstrap outputs).
name: Deploy to AgentCore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to approve each deploy.
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      CODE_BUCKET: ${{ vars.CODE_BUCKET }}
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Package the server as an ARM64 zip and upload it
        # From the repository root (the job default is deploy/terraform).
        working-directory: .
        run: |
          key="$(python deploy/agentcore/package.py)"
          aws s3 cp deploy/agentcore/build/agentcore-code.zip "s3://$CODE_BUCKET/$key"
          echo "CODE_KEY=$key" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Terraform init
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=pets-tiny-mcp/terraform.tfstate"
          -backend-config="region=$AWS_REGION"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"
      - name: Terraform plan
        run: terraform plan -input=false -var "code_key=$CODE_KEY" -out=tfplan
      - name: Terraform apply
        run: terraform apply -input=false tfplan
      - name: Show the MCP endpoint
        run: |
          echo "MCP URL: $(terraform output -raw mcp_url)" >> "$GITHUB_STEP_SUMMARY"
