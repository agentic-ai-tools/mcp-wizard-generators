# Generated by mcp-wizard-generators. Tests the MCP server on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (hash-checked)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest>=8,<10"
      - name: Test (no network; the upstream API is mocked)
        run: python -m pytest
      - name: Check the exposed tools
        run: python -m pets_tiny_mcp.verify

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install (hash-checked)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Build the image
        run: docker build -t pets-tiny-mcp:ci .
      - name: Start it with MCP_AUTH=platform (this smoke test sends no token)
        run: >-
          docker run --detach --name mcp
          -p 127.0.0.1:8000:8000
          -e API_BASE_URL=https://api.example.com
          -e MCP_AUTH=platform
          pets-tiny-mcp:ci
      - name: Call it over streamable HTTP
        run: |
          for attempt in $(seq 1 30); do
            if python -m pets_tiny_mcp.verify --url http://127.0.0.1:8000/mcp; then exit 0; fi
            echo "not ready yet (attempt $attempt)"; sleep 2
          done
          docker logs mcp
          exit 1
