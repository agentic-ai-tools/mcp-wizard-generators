# Run: docker compose up --build   (README: Run with Docker)
services:
  pets-tiny-mcp:
    build: .
    image: pets-tiny-mcp:local
    ports:
      # This machine only. Publish more widely only with JWT auth.
      # Port taken? Set MCP_HOST_PORT in .env (for example 8001).
      - "127.0.0.1:${MCP_HOST_PORT:-8000}:8000"
    env_file:
      # API_BASE_URL and upstream credentials; never baked into the image.
      - path: .env
        required: false
    environment:
      # Every request needs a bearer token from this identity provider.
      MCP_AUTH: "jwt"
      MCP_JWT_DISCOVERY_URL: "https://login.example.com/tenant/.well-known/openid-configuration"
      MCP_JWT_AUDIENCES: "api://pets"
      MCP_JWT_CLIENTS: ""
      MCP_JWT_SCOPES: ""
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped
