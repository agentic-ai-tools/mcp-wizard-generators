[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pets-tiny-mcp"
version = "0.1.0"
description = "Generated MCP server for Pets Tiny API (AgentCore)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pets-tiny-mcp-mcp = "pets_tiny_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pets_tiny_mcp"]
